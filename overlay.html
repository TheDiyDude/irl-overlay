<!DOCTYPE html>
<html lang="de">
<head>
    <script src="credentials.js"></script>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: transparent;
            margin: 0;
            padding: 10px;
            color: #ffffff;
        }

        .bar-container {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(15, 15, 20, 0.85);
            padding: 10px 18px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: fit-content;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
        }

        .item i {
            color: #00d2ff;
            font-size: 18px;
        }

        .divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
        }

        .green-text { color: #00ff88; }
        
        /* Live Indicator Dot */
        .live-dot {
            font-size: 10px;
            color: #00ff88;
            margin-right: -4px;
            transition: opacity 0.2s ease-in-out;
        }
        .live-dot.dim { opacity: 0.2; }
    </style>
</head>
<body>

<div class="bar-container">
    <div class="item">
        <span id="dot" class="live-dot">●</span>
        <i class="fa-solid fa-wifi"></i>
        <span id="bitrate" class="green-text">-- Mbps</span>
    </div>

    <div class="divider"></div>

    <div class="item">
        <i class="fa-solid fa-gauge-high"></i>
        <span id="speed">0 km/h</span>
    </div>

    <div class="divider"></div>

    <div class="item">
        <i class="fa-solid fa-route"></i>
        <span id="distance">0.0 km</span>
    </div>

    <div class="divider"></div>

    <div class="item">
        <i class="fa-solid fa-location-dot"></i>
        <span id="location">Loading location...</span>
    </div>

    <div class="divider"></div>

    <div class="item">
        <span id="weather-icon">⏳</span>
        <span id="temp">--°C</span>
    </div>

    <div class="divider"></div>

    <div class="item">
        <i class="fa-regular fa-clock"></i>
        <span id="datetime">--:--:--</span>
    </div>
</div>

<script>

    let totalDistanceKm = 0.0;
    let lastLat = null;
    let lastLon = null;
    let traccarInternalId = null;
    let lastGeocodeLat = null;
    let lastGeocodeLon = null;

    async function fetchWithTimeout(url, options = {}, timeoutMs = 3000) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeoutMs);
        try {
            const response = await fetch(url, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        } catch (e) {
            clearTimeout(id);
            throw e;
        }
    }

	// --- BELABOX BITRATE (realtime query) ---
    async function updateBitrate() {
        const bitrateEl = document.getElementById('bitrate');
        const dotEl = document.getElementById('dot');

        dotEl.classList.toggle('dim');

        try {
            const targetUrl = `http://${SRTLA_STATS_IP}:${SRTLA_STATS_PORT}/stats?streamer=${encodeURIComponent(SRTLA_STATS_USER)}&key=${encodeURIComponent(SRTLA_STATS_KEY)}&_t=${Date.now()}`;
            
            const res = await fetch(targetUrl, { cache: "no-store" });
            if (!res.ok) {
                bitrateEl.innerText = "0.00 Mbps";
                return;
            }

            const data = await res.json();

            function findMbps(obj) {
                if (!obj || typeof obj !== 'object') return null;

                if (obj.mbpsRecvRate !== undefined && obj.mbpsRecvRate !== null) {
                    const val = parseFloat(obj.mbpsRecvRate);
                    if (!isNaN(val) && val > 0) return val;
                }

                if (obj.bitrate !== undefined && obj.bitrate !== null) {
                    const val = parseFloat(obj.bitrate);
                    if (!isNaN(val) && val > 0) return val > 1000 ? val / 1000 : val;
                }

                for (const key in obj) {
                    if (typeof obj[key] === 'object' && obj[key] !== null) {
                        const found = findMbps(obj[key]);
                        if (found !== null) return found;
                    }
                }
                return null;
            }

            const mbps = findMbps(data);
            bitrateEl.innerText = (mbps !== null && mbps > 0) ? `${mbps.toFixed(2)} Mbps` : "0.00 Mbps";

        } catch (e) {
            bitrateEl.innerText = "0.00 Mbps";
        }
    }
    setInterval(updateBitrate, 1000);

    // --- TRACCAR ---
    async function updateTraccar() {
        const locEl = document.getElementById('location');
        try {
            const authHeader = 'Basic ' + btoa(TRACCAR_USER + ':' + TRACCAR_PASS);

            if (!traccarInternalId) {
                const devRes = await fetchWithTimeout(`${TRACCAR_URL}/api/devices`, {
                    headers: { 'Authorization': authHeader }
                }, 2000);

                if (devRes.ok) {
                    const devices = await devRes.json();
                    if (devices && devices.length > 0) {
                        const dev = devices.find(d => 
                            d.id.toString() === TRACCAR_DEVICE_ID.toString() || 
                            d.uniqueId.toString() === TRACCAR_DEVICE_ID.toString() ||
                            d.name.toLowerCase() === TRACCAR_DEVICE_ID.toLowerCase()
                        ) || devices[0];

                        traccarInternalId = dev.id;
                    }
                }
            }

            const posUrl = traccarInternalId 
                ? `${TRACCAR_URL}/api/positions?deviceId=${traccarInternalId}`
                : `${TRACCAR_URL}/api/positions`;

            const res = await fetchWithTimeout(posUrl, {
                headers: { 'Authorization': authHeader },
                cache: "no-store"
            }, 2000);

            if (!res.ok) return;

            const data = await res.json();

            if (data && data.length > 0) {
                const pos = data[data.length - 1];

                const speedKmH = Math.round((pos.speed || 0) * 1.852);
                document.getElementById('speed').innerText = `${speedKmH} km/h`;

                if (pos.address) {
                    locEl.innerText = pos.address.split(',')[0].trim();
                } else if (pos.latitude && pos.longitude) {
                    resolveCityName(pos.latitude, pos.longitude);
                }

                if (pos.latitude && pos.longitude) {
                    if (lastLat !== null && lastLon !== null) {
                        const d = getDistanceInKm(lastLat, lastLon, pos.latitude, pos.longitude);
                        if (d > 0.02) {
                            totalDistanceKm += d;
                            lastLat = pos.latitude;
                            lastLon = pos.longitude;
                        }
                    } else {
                        lastLat = pos.latitude;
                        lastLon = pos.longitude;
                    }
                    document.getElementById('distance').innerText = `${totalDistanceKm.toFixed(1)} km`;
                    updateWeather(pos.latitude, pos.longitude);
                }
            }
        } catch (e) {}
    }

    async function resolveCityName(lat, lon) {
        if (lastGeocodeLat !== null && lastGeocodeLon !== null) {
            const dist = getDistanceInKm(lastGeocodeLat, lastGeocodeLon, lat, lon);
            if (dist < 0.5) return;
        }

        try {
            const res = await fetchWithTimeout(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=de`, {}, 3000);
            const data = await res.json();

            const cityName = data.locality || data.city || data.principalSubdivision;
            if (cityName) {
                document.getElementById('location').innerText = cityName;
                lastGeocodeLat = lat;
                lastGeocodeLon = lon;
            }
        } catch (e) {}
    }

    function getDistanceInKm(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    // --- WEATHER ---
    async function updateWeather(lat, lon) {
        try {
            const res = await fetchWithTimeout(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`, {}, 3000);
            const data = await res.json();
            
            if (data && data.current_weather) {
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;
                
                document.getElementById('temp').innerText = `${temp}°C`;
                document.getElementById('weather-icon').innerText = getWeatherSymbol(code);
            }
        } catch (e) {}
    }

    function getWeatherSymbol(code) {
        if (code === 0) return "☀️";
        if ([1, 2, 3].includes(code)) return "⛅";
        if ([45, 48].includes(code)) return "🌫️";
        if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return "🌧️";
        if ([71, 73, 75, 85, 86].includes(code)) return "❄️";
        if ([95, 96, 99].includes(code)) return "⛈️";
        return "🌡️";
    }

    // --- DATE and TIME ---
    function updateClock() {
        const now = new Date();
        const dateStr = now.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const timeStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        document.getElementById('datetime').innerText = `${dateStr} ${timeStr}`;
    }

    setInterval(updateClock, 1000);
    setInterval(updateTraccar, 2000);
    
    updateClock();
    updateTraccar();
    updateBitrate(); 
</script>
</body>
</html>
